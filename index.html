<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7eaff">
<meta name="description" content="Un escritorio digital personalizable">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Mi Mundo · Escritorio</title>
<style>
:root{--bg:#fff5fb;--panel:#fff;--text:#563c66;--muted:#8d7898;--accent:#c58be8;--tile1:#f7d9ed;--tile2:#dcd7ff;--tile3:#d5edff;--tile4:#d8f3e5;--tile5:#ffebc9;--tile6:#fbd6d6;--radius:25px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--text);background:var(--bg);background-size:cover;background-position:center;background-attachment:fixed}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.shell{max-width:1180px;margin:auto;padding:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid #ffffffa8;border-radius:28px;padding:18px 22px;box-shadow:0 10px 35px #6c4c7720;backdrop-filter:blur(12px)}
.brand h1{margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-1px}.brand p{margin:4px 0 0;color:var(--muted)}
.weather{display:flex;align-items:center;gap:14px;text-align:right}.clock{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums}.date,.weather small{display:block;color:var(--muted);font-size:13px}
.weather-icon{font-size:28px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.action{padding:11px 15px;border-radius:15px;background:var(--panel);color:var(--text);box-shadow:0 4px 15px #5b3d6b12;font-weight:700}.action.primary{background:var(--accent);color:white}.action:hover,.tile:hover{transform:translateY(-2px);filter:saturate(1.08)}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 3px 12px}.section-title h2{margin:0;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px}
.tile{position:relative;min-height:155px;border-radius:var(--radius);padding:17px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#574365;text-decoration:none;box-shadow:0 9px 24px #4d31551a;transition:.18s;cursor:grab;border:2px solid #ffffffa8;overflow:hidden}
.tile img{width:56px;height:56px;object-fit:contain;border-radius:15px;background:#ffffffb8;padding:5px}.tile .emoji{font-size:53px;line-height:1}.tile strong{font-size:16px;text-align:center;overflow-wrap:anywhere}.tile .kind{font-size:11px;opacity:.65}
.tile .edit{position:absolute;right:8px;top:8px;background:#ffffffb8;border-radius:10px;padding:5px 7px;font-size:12px}
.empty{padding:35px 20px;text-align:center;background:#ffffff9c;border-radius:24px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 8px}
.modal-back{position:fixed;inset:0;background:#23172b70;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-back.show{display:flex}
.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border-radius:25px;padding:22px;box-shadow:0 20px 70px #0003}
.modal h2{margin:0 0 14px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:var(--muted)}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #d9cde0;border-radius:12px;background:#fff;color:#44354d}
.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}.theme-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.theme{padding:12px;border:2px solid transparent;border-radius:16px;text-align:left;background:#f7f2fa;color:#44354d}.theme.active{border-color:var(--accent)}.swatches{display:flex;gap:5px;margin-bottom:7px}.swatches i{width:22px;height:22px;border-radius:50%;display:block}
.settings-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.settings-tabs button{padding:8px 11px;border-radius:12px;background:#f1eaf5;color:#604d6a}.settings-tabs button.active{background:var(--accent);color:white}
.panel{display:none}.panel.active{display:block}.hint{font-size:12px;color:var(--muted);line-height:1.5}
#fileRestore{display:none}
@media(max-width:600px){.shell{padding:12px}.top{padding:15px}.weather{width:100%;justify-content:space-between;text-align:left}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.tile{min-height:137px}.toolbar .action{flex:1 1 auto}.theme-list{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
 <div class="brand"><h1 id="deskTitle">Mi Mundo ✨</h1><p id="subtitle">¡Tu pequeño mundo digital!</p></div>
 <div class="weather"><div><div class="clock" id="clock">--:--</div><span class="date" id="date">Cargando fecha…</span></div><div><span class="weather-icon" id="weatherIcon">🌤️</span><small id="weatherText">Consultando tiempo…</small><small id="weatherPlace">Niebla (Huelva)</small></div></div>
</header>
<nav class="toolbar" aria-label="Menú principal">
 <button class="action primary" id="addApp">＋ Añadir aplicación</button>
 <button class="action" id="addLink">🔗 Añadir enlace</button>
 <button class="action" id="themesBtn">🎨 Temas</button>
 <button class="action" id="settingsBtn">⚙️ Ajustes</button>
 <button class="action" id="backupBtn">💾 Copia de seguridad</button>
 <button class="action" id="restoreBtn">📂 Restaurar copia</button>
 <input id="fileRestore" type="file" accept="application/json,.json">
</nav>
<div class="section-title"><h2>Mis aplicaciones 💜</h2><span class="hint">Mantén pulsado y arrastra para ordenar</span></div>
<main id="appGrid" class="grid"></main>
<footer>Hecho con cariño · Créditos: Alfonso M. Martín Boza</footer>
</div>

<div class="modal-back" id="modalBack"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle">Personalizar</h2><div id="modalBody"></div><div class="modal-actions" id="modalActions"></div></section></div>
<script>
const defaultApps=[
 {id:'a1',name:'Aprender',url:'https://www.google.com',icon:'📚',color:'var(--tile1)',type:'app'},
 {id:'a2',name:'Juegos',url:'https://www.juegos.com',icon:'🎮',color:'var(--tile2)',type:'app'},
 {id:'a3',name:'Creatividad',url:'https://www.canva.com',icon:'🎨',color:'var(--tile5)',type:'app'},
 {id:'a4',name:'Música',url:'https://www.youtube.com',icon:'🎵',color:'var(--tile3)',type:'app'},
 {id:'a5',name:'Internet',url:'https://www.google.com',icon:'🌍',color:'var(--tile4)',type:'app'},
 {id:'a6',name:'Notas',url:'https://keep.google.com',icon:'📝',color:'var(--tile6)',type:'app'}
];
const themes={
 'Pastel kawaii':{bg:'#fff5fb',panel:'#ffffff',text:'#563c66',muted:'#8d7898',accent:'#c58be8',tiles:['#f7d9ed','#dcd7ff','#d5edff','#d8f3e5','#ffebc9','#fbd6d6']},
 'Sueño lila':{bg:'#f3efff',panel:'#fff',text:'#493d70',muted:'#8176a0',accent:'#9c83e6',tiles:['#dfd4ff','#e9dcff','#d8e4ff','#f4d9f2','#d7eaff','#fce2ee']},
 'Unicornio':{bg:'#fff0fa',panel:'#fff',text:'#68456e',muted:'#9b7b9e',accent:'#ed8dc8',tiles:['#ffcfe9','#e4d4ff','#ccecff','#d2f5e6','#fff0b8','#ffd9d5']},
 'Océano':{bg:'#eaf8ff',panel:'#fff',text:'#31566a',muted:'#66899b',accent:'#56a9d5',tiles:['#c9edff','#cce4ff','#c8f3ed','#d9f2ff','#e0e0ff','#ffe3ee']},
 'Jardín':{bg:'#effaf1',panel:'#fff',text:'#3e604c',muted:'#78927f',accent:'#79b98d',tiles:['#d4f0d7','#e3f2c9','#cdeee9','#ffeacb','#f8dce7','#dce5ff']},
 'Atardecer':{bg:'#fff4e9',panel:'#fff',text:'#704c46',muted:'#a17d72',accent:'#ee9c79',tiles:['#ffd9c9','#ffe8b8','#fbd5e5','#e7ddff','#d8edff','#d7f0dc']}
};
let state=loadState(), dragId=null, currentModalSave=null;
function loadState(){try{return {...{title:'Mi Mundo ✨',subtitle:'¡Tu pequeño mundo digital!',theme:'Pastel kawaii',apps:defaultApps,customBg:'',customText:'',customAccent:'',tileSize:155},...JSON.parse(localStorage.getItem('mimundo-data')||'{}')}}catch(e){return {title:'Mi Mundo ✨',subtitle:'¡Tu pequeño mundo digital!',theme:'Pastel kawaii',apps:defaultApps,customBg:'',customText:'',customAccent:'',tileSize:155}}}
function save(){localStorage.setItem('mimundo-data',JSON.stringify(state))}
function applyTheme(name){state.theme=name;const t=themes[name]||themes['Pastel kawaii'];let r=document.documentElement;r.style.setProperty('--bg',state.customBg||t.bg);r.style.setProperty('--panel',t.panel);r.style.setProperty('--text',state.customText||t.text);r.style.setProperty('--muted',t.muted);r.style.setProperty('--accent',state.customAccent||t.accent);t.tiles.forEach((c,i)=>r.style.setProperty('--tile'+(i+1),c));save();render()}
function render(){document.getElementById('deskTitle').textContent=state.title;document.getElementById('subtitle').textContent=state.subtitle;let g=document.getElementById('appGrid');g.innerHTML='';
 if(!state.apps.length){g.innerHTML='<div class="empty">Todavía no hay aplicaciones.<br>¡Pulsa «Añadir aplicación» para empezar! 🌷</div>';return}
 state.apps.forEach((a,i)=>{let el=document.createElement('div');el.className='tile';el.draggable=true;el.style.background=a.color||`var(--tile${i%6+1})`;el.style.minHeight=(state.tileSize||155)+'px';el.dataset.id=a.id;
 let icon;if(a.iconUrl){icon=document.createElement('img');icon.src=a.iconUrl;icon.alt='';icon.onerror=()=>{icon.replaceWith(makeEmoji(a.icon||'🌸'))}}else icon=makeEmoji(a.icon||'🌸');
 let name=document.createElement('strong');name.textContent=a.name;let kind=document.createElement('span');kind.className='kind';kind.textContent=a.type==='link'?'ENLACE':'APLICACIÓN';
 let edit=document.createElement('button');edit.className='edit';edit.textContent='✏️';edit.title='Editar';edit.onclick=e=>{e.stopPropagation();openItemModal(a)};
 el.append(icon,name,kind,edit);el.addEventListener('click',()=>{if(a.url)window.open(a.url,'_blank','noopener')});
 el.addEventListener('dragstart',e=>{dragId=a.id;e.dataTransfer.effectAllowed='move'});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();if(!dragId||dragId===a.id)return;let from=state.apps.findIndex(x=>x.id===dragId),to=state.apps.findIndex(x=>x.id===a.id);let moved=state.apps.splice(from,1)[0];state.apps.splice(to,0,moved);dragId=null;save();render()});g.append(el)});
}
function makeEmoji(v){let s=document.createElement('span');s.className='emoji';s.textContent=v;return s}
function showModal(title,body,actions){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;let a=document.getElementById('modalActions');a.innerHTML='';actions.forEach(x=>{let b=document.createElement('button');b.className='action '+(x.primary?'primary':'');b.textContent=x.label;b.onclick=x.click;a.append(b)});document.getElementById('modalBack').classList.add('show')}
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function openThemeModal(){let body='<p class="hint">Elige un aspecto prediseñado. Puedes cambiarlo cuando quieras.</p><div class="theme-list">'+Object.entries(themes).map(([n,t])=>`<button class="theme ${state.theme===n?'active':''}" data-theme="${n}"><span class="swatches">${t.tiles.slice(0,5).map(c=>`<i style="background:${c}"></i>`).join('')}</span><b>${n}</b></button>`).join('')+'</div>';showModal('🎨 Elige tu tema',body,[{label:'Cerrar',click:closeModal}]);document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.customBg='';state.customText='';state.customAccent='';applyTheme(b.dataset.theme);openThemeModal()})}
function openSettings(){let body=`<div class="settings-tabs"><button class="active" data-tab="look">Apariencia</button><button data-tab="text">Texto</button><button data-tab="layout">Cuadros</button></div>
<div class="panel active" id="look"><div class="field"><label>Color de fondo</label><input type="color" id="bgColor" value="${state.customBg||themes[state.theme].bg}"></div><div class="field"><label>Color de acento</label><input type="color" id="accentColor" value="${state.customAccent||themes[state.theme].accent}"></div><div class="field"><label>Imagen de fondo (URL)</label><input id="bgImage" placeholder="https://…" value="${state.bgImage||''}"></div><p class="hint">Si escribes una URL de imagen, se usará como fondo. Déjala vacía para usar el color.</p></div>
<div class="panel" id="text"><div class="field"><label>Nombre del escritorio</label><input id="titleInput" value="${esc(state.title)}"></div><div class="field"><label>Frase de bienvenida</label><input id="subtitleInput" value="${esc(state.subtitle)}"></div><div class="field"><label>Color del texto</label><input type="color" id="textColor" value="${state.customText||themes[state.theme].text}"></div></div>
<div class="panel" id="layout"><div class="field"><label>Altura de los cuadros</label><input type="range" min="125" max="230" step="5" id="tileSize" value="${state.tileSize||155}"><span class="hint">Arrastra los cuadros para cambiar su posición.</span></div></div>`;
 showModal('⚙️ Personalizar escritorio',body,[{label:'Cancelar',click:closeModal},{label:'Guardar cambios',primary:true,click:()=>{state.customBg=document.getElementById('bgColor').value;state.customAccent=document.getElementById('accentColor').value;state.bgImage=document.getElementById('bgImage').value.trim();state.title=document.getElementById('titleInput').value||'Mi Mundo ✨';state.subtitle=document.getElementById('subtitleInput').value;state.customText=document.getElementById('textColor').value;state.tileSize=+document.getElementById('tileSize').value;document.body.style.backgroundImage=state.bgImage?`url("${state.bgImage.replace(/"/g,'')}")`:'';applyTheme(state.theme);closeModal()} }]);
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===b.dataset.tab))});
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openItemModal(item=null,type='app'){
 let a=item||{id:'x'+Date.now(),name:'',url:'',icon:'🌸',iconUrl:'',color:'',type};
 let body=`<div class="field"><label>Nombre</label><input id="itemName" maxlength="35" value="${esc(a.name)}" placeholder="Ej. Matemáticas"></div>
 <div class="field"><label>Dirección web</label><input id="itemUrl" type="url" value="${esc(a.url)}" placeholder="https://…"></div>
 <div class="field"><label>Icono (emoji)</label><input id="itemIcon" maxlength="8" value="${esc(a.icon||'🌸')}" placeholder="📚"></div>
 <div class="field"><label>Elegir icono desde una carpeta</label><input id="itemIconFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"><span class="hint">Selecciona una imagen de tu móvil u ordenador. Tamaño máximo: 700 KB.</span></div>
 <div class="field"><label>Imagen o favicon personalizado (URL)</label><input id="itemIconUrl" value="${esc(a.iconUrl||'')}" placeholder="https://…/icon.png"></div>
 <div class="field"><label>Color del cuadro</label><input id="itemColor" type="color" value="${a.color&&a.color.startsWith('#')?a.color:'#f7d9ed'}"></div>
 <p class="hint">Si eliges un archivo, tendrá prioridad sobre la URL y el favicon automático. Puedes cambiarlo cuando quieras.</p>`;
 let actions=[{label:'Cancelar',click:closeModal}];
 if(item)actions.push({label:'Eliminar',click:()=>{if(confirm('¿Eliminar este cuadro?')){state.apps=state.apps.filter(x=>x.id!==a.id);save();render();closeModal()}}});
 actions.push({label:'Guardar',primary:true,click:()=>{
   let name=document.getElementById('itemName').value.trim(),url=document.getElementById('itemUrl').value.trim();
   if(!name||!url){alert('Escribe un nombre y una dirección web.');return}
   if(!/^https?:\/\//i.test(url))url='https://'+url;
   let file=document.getElementById('itemIconFile').files[0];
   if(file){
     if(!file.type.startsWith('image/')){alert('Selecciona un archivo de imagen.');return}
     if(file.size>700*1024){alert('La imagen ocupa más de 700 KB. Elige una imagen más pequeña.');return}
     let reader=new FileReader();
     reader.onload=()=>saveItem(reader.result);
     reader.onerror=()=>alert('No se pudo leer la imagen. Prueba con otro archivo.');
     reader.readAsDataURL(file);
   }else{
     let iconUrl=document.getElementById('itemIconUrl').value.trim();
     if(!iconUrl){try{iconUrl='https://www.google.com/s2/favicons?domain='+new URL(url).hostname+'&sz=128'}catch(e){}}
     saveItem(iconUrl);
   }
   function saveItem(iconUrl){
     let obj={...a,name,url,icon:document.getElementById('itemIcon').value||'🌸',iconUrl,color:document.getElementById('itemColor').value,type:a.type||type};
     let idx=state.apps.findIndex(x=>x.id===a.id);
     if(idx>=0)state.apps[idx]=obj;else state.apps.push(obj);
     try{save();render();closeModal()}catch(e){alert('No se ha podido guardar. La imagen puede ser demasiado grande.')}
   }
 }});
 showModal(item?'Editar cuadro':'Añadir '+(type==='link'?'enlace':'aplicación'),body,actions)
}
function backup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='copia-mi-escritorio.json';a.click();URL.revokeObjectURL(u)}
function restore(file){let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.apps))throw Error();state={...state,...d};save();applyTheme(state.theme);document.body.style.backgroundImage=state.bgImage?`url("${state.bgImage}")`:'';alert('Copia restaurada correctamente.')}catch(e){alert('No se ha podido leer la copia. Comprueba que sea un archivo de Mi Escritorio.')}};r.readAsText(file)}
document.getElementById('addApp').onclick=()=>openItemModal(null,'app');document.getElementById('addLink').onclick=()=>openItemModal(null,'link');document.getElementById('themesBtn').onclick=openThemeModal;document.getElementById('settingsBtn').onclick=openSettings;document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('fileRestore').click();document.getElementById('fileRestore').onchange=e=>{if(e.target.files[0])restore(e.target.files[0]);e.target.value=''};
document.getElementById('modalBack').addEventListener('click',e=>{if(e.target.id==='modalBack')closeModal()});
function tick(){let d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});document.getElementById('date').textContent=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}tick();setInterval(tick,1000);
async function weather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.36&longitude=-6.68&current=temperature_2m,weather_code&timezone=Europe%2FMadrid');let j=await r.json(),t=Math.round(j.current.temperature_2m),c=j.current.weather_code;let icon=c===0?'☀️':c<3?'🌤️':c<50?'☁️':c<70?'🌧️':c<80?'🌨️':'⛈️';document.getElementById('weatherIcon').textContent=icon;document.getElementById('weatherText').textContent=t+' °C · '+({0:'Despejado',1:'Mayormente despejado',2:'Parcialmente nuboso',3:'Nublado',45:'Niebla',48:'Niebla',51:'Llovizna',61:'Lluvia',71:'Nieve',95:'Tormenta'}[c]||'Tiempo actual')}catch(e){document.getElementById('weatherText').textContent='Tiempo no disponible'}}
weather();applyTheme(state.theme);if(state.bgImage)document.body.style.backgroundImage=`url("${state.bgImage}")`;
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let b=document.createElement('button');b.className='action primary';b.id='installBtn';b.textContent='⬇️ Instalar';document.querySelector('.toolbar').prepend(b);b.onclick=async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;b.remove()}});window.addEventListener('appinstalled',()=>{let b=document.getElementById('installBtn');if(b)b.remove()});
</script>
</body></html>
